<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <defs>
    <!-- Gold Linear Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="35%" stop-color="#E5C158"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996E14"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Metallic Stroke Gradient -->
    <linearGradient id="strokeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#805809"/>
      <stop offset="50%" stop-color="#F5DF88"/>
      <stop offset="100%" stop-color="#E5C158"/>
    </linearGradient>
  </defs>

  <!-- Group Icon/Emblem -->
  <g transform="translate(20, 15)">
    <!-- Outer Aperture Ring -->
    <circle cx="65" cy="65" r="58" fill="#121316" stroke="url(#strokeGrad)" stroke-width="2.5" />
    <circle cx="65" cy="65" r="50" fill="none" stroke="rgba(212,175,55,0.25)" stroke-width="1.5" stroke-dasharray="4 4" />

    <!-- Aperture Blades (Camera/Media aesthetic) -->
    <path d="M 65 15 L 85 45 L 65 55 Z" fill="url(#goldGrad)" opacity="0.35"/>
    <path d="M 115 65 L 85 85 L 75 65 Z" fill="url(#goldGrad)" opacity="0.35"/>
    <path d="M 65 115 L 45 85 L 65 75 Z" fill="url(#goldGrad)" opacity="0.35"/>
    <path d="M 15 65 L 45 45 L 55 65 Z" fill="url(#goldGrad)" opacity="0.35"/>

    <!-- Inner Core Circle with subtle dark fill -->
    <circle cx="65" cy="65" r="38" fill="#0C0D0F" stroke="url(#goldGrad)" stroke-width="2" />

    <!-- Stylized Interlocking Monogram 'RS' -->
    <text x="65" y="78" 
          font-family="'Syne', 'Montserrat', sans-serif" 
          font-size="34" 
          font-weight="900" 
          letter-spacing="-1.5"
          fill="url(#goldGrad)" 
          text-anchor="middle"
          filter="url(#goldGlow)">RS</text>

    <!-- Lens Glint Accent -->
    <circle cx="95" cy="35" r="3" fill="#FFF8D6" filter="url(#goldGlow)"/>
    <polygon points="95,28 97,35 104,35 98,39 100,46 95,41 90,46 92,39 86,35 93,35" fill="url(#goldGrad)" transform="translate(15,-10) scale(0.6)"/>
  </g>

  <!-- Typography: RS MEDIA CONSULT -->
  <g transform="translate(170, 42)">
    <!-- Main Title -->
    <text x="0" y="42" 
          font-family="'Syne', 'Montserrat', 'Plus Jakarta Sans', sans-serif" 
          font-size="40" 
          font-weight="800" 
          letter-spacing="4" 
          fill="#FFFFFF">RS MEDIA</text>
    
    <!-- Accent 'CONSULT' in radiant gold with broad tracking -->
    <text x="245" y="42" 
          font-family="'Syne', 'Montserrat', 'Plus Jakarta Sans', sans-serif" 
          font-size="40" 
          font-weight="800" 
          letter-spacing="4" 
          fill="url(#goldGrad)">CONSULT</text>

    <!-- Subtitle Line -->
    <text x="2" y="72" 
          font-family="'Plus Jakarta Sans', sans-serif" 
          font-size="12.5" 
          font-weight="600" 
          letter-spacing="6" 
          fill="#A0A5B5">CREATIVE MEDIA &amp; DIGITAL SOLUTIONS</text>
    
    <!-- Decorative Gold Divider Line -->
    <line x1="2" y1="84" x2="380" y2="84" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.7"/>
    <circle cx="380" cy="84" r="2.5" fill="#E5C158"/>
  </g>
</svg>
